name: Node CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Node.js app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Use npm install because the starter repo does not include a lockfile yet.
        run: npm install

      - name: Run tests
        run: npm test
